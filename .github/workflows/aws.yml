name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          debug: true
          use_insecure_cipher: true
          script: |
              # Load nvm and use Node 20
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              
              # Install Node 20 if not present, then use it
              nvm install 20 || true
              nvm use 20
              
              echo "Node version: $(node -v)"
              echo "Starting Deployment..."
              pwd
              ls -la
              
              echo "Node version: $(node -v)"
              echo "Starting Deployment..."
              pwd
              ls -la
              
              # Target directory
              if [ -d "Assignflow" ]; then
                cd Assignflow
              elif [ -d "assignflow" ]; then
                cd assignflow
              elif [ -d "ssignflow" ]; then
                cd ssignflow
              else
                echo "Directory not found, listing home:"
                ls -la
                # Try to handle case where directory is missing
                echo "❌ Project directory not found!"
                exit 1
              fi
              
              echo "Deploying in $(pwd)"
              
              # Securely inject ALL Secrets
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
              echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
              echo "PORT=8080" >> .env
              
              # Clean Clean Clean!
              echo "Cleaning dependencies and artifacts..."
              rm -rf node_modules dist
              
              echo "Installing Dependencies..."
              npm install
              
              echo "Building..."
              npm run build:static
              
              echo "Restarting Server..."
              pm2 delete all || true
              pm2 start dist/index.js --name "assignflow"
              pm2 save
              
              echo "✅ Deployment & Reset Complete"
