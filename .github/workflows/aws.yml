name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
              # Install Node.js 18 and Git if missing
              if ! command -v node &> /dev/null; then
                echo "Installing Node.js & Git..."
                curl -sL https://rpm.nodesource.com/setup_18.x | sudo bash -
                sudo yum install -y nodejs git
              fi

              # Install PM2 if missing
              if ! command -v pm2 &> /dev/null; then
                echo "Installing PM2..."
                sudo npm install -g pm2
              fi

              # Check/Clone Repository
              if [ ! -d "ssignflow" ]; then
                echo "Cloning repository..."
                git clone https://github.com/sumitkumards07/ssignflow.git
              fi

              cd ssignflow
              echo "Pulling latest changes..."
              git fetch origin
              git reset --hard origin/main
              
              echo "Deploying in $(pwd)"
              
              # Securely inject ALL Secrets
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
              echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
              echo "PORT=8080" >> .env
              
              # Clean install
              echo "Cleaning dependencies..."
              rm -rf node_modules dist
              
              echo "Installing Dependencies..."
              npm config set fetch-retries 5
              npm config set fetch-retry-mintimeout 20000
              npm install --legacy-peer-deps
              
              echo "Building..."
              npm run build:static
              
              echo "Restarting Server..."
              pm2 delete all || true
              pm2 start dist/index.js --name "assignflow"
              pm2 save
              
              echo "✅ Deployment & Reset Complete"
