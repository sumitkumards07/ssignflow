name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
              export PATH=$PATH:/usr/local/bin:/home/ec2-user/.nvm/versions/node/v20.18.0/bin
              echo "Starting Deployment..."
              pwd
              ls -la
              
              # Try to find the directory
              if [ -d "Assignflow" ]; then
                cd Assignflow
              elif [ -d "assignflow" ]; then
                cd assignflow
              elif [ -d "ssignflow" ]; then
                cd ssignflow
              else
                echo "❌ Project directory not found!"
                exit 1
              fi
              
              echo "Deploying in $(pwd)"
              
              # Securely inject ALL Secrets
              # This reconstructs the .env file on every deploy
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
              echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
              echo "PORT=8080" >> .env
              
              # Clean Clean Clean!
              echo "Cleaning dependencies and artifacts..."
              rm -rf node_modules dist
              
              echo "Installing Dependencies..."
              npm install
              
              echo "Building..."
              npm run build:static
              
              echo "Restarting Server..."
              # Ensure process is started
              pm2 delete all || true
              pm2 start dist/index.js --name "assignflow"
              pm2 save
              
              echo "✅ Deployment & Reset Complete"
