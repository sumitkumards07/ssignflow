name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          debug: true
          use_insecure_cipher: true
          script: |
              # Use system node (presumed v18+)
              echo "Node version: $(node -v)"
              echo "Starting Deployment..."
              pwd
              ls -la
              
              # Target directory
              if [ -d "ssignflow" ]; then
                cd ssignflow
              elif [ -d "Assignflow" ]; then
                cd Assignflow
              elif [ -d "assignflow" ]; then
                cd assignflow
              else
                 echo "❌ Project directory not found in $(pwd)"
                 echo "Attempting to find it..."
                 find . -maxdepth 2 -type d -name "*signflow*"
                 exit 1
              fi
              
              echo "Deploying in $(pwd)"
              
              # Securely inject ALL Secrets
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
              echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
              echo "PORT=8080" >> .env
              
              # Clean install
              echo "Cleaning dependencies..."
              rm -rf node_modules dist
              
              echo "Installing Dependencies..."
              npm config set fetch-retries 5
              npm config set fetch-retry-mintimeout 20000
              npm install --legacy-peer-deps
              
              echo "Building..."
              npm run build:static
              
              echo "Restarting Server..."
              pm2 delete all || true
              pm2 start dist/index.js --name "assignflow"
              pm2 save
              
              echo "✅ Deployment & Reset Complete"
