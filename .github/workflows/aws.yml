name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: 3.237.33.146
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
              export PATH=$PATH:/usr/local/bin:/home/ec2-user/.nvm/versions/node/v20.18.0/bin
              echo "Starting Deployment..."
              pwd
              ls -la
              
              # Try to find the directory
              if [ -d "Assignflow" ]; then
                cd Assignflow
              elif [ -d "assignflow" ]; then
                cd assignflow
              elif [ -d "ssignflow" ]; then
                cd ssignflow
              else
                echo "❌ Project directory not found!"
                exit 1
              fi
              
              echo "Deploying in $(pwd)"
              
              # Update API Key
              echo "Updating API Key..."
              if [ -f .env ]; then
                if grep -q "GEMINI_API_KEY" .env; then
                  sed -i 's|^GEMINI_API_KEY=.*|GEMINI_API_KEY=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|' .env
                else
                  echo "GEMINI_API_KEY=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" >> .env
                fi
              else
                echo "Creating .env file"
                echo "GEMINI_API_KEY=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" > .env
              fi
              
              git pull origin main
              npm install
              npm run build:static
              pm2 restart all || pm2 start dist/index.js --name "assignflow"
              echo "✅ Deployment Complete"
