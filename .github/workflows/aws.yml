name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: 3.237.33.146
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
              cd Assignflow
              git pull origin main
              npm install
              npm run build:static
              pm2 restart all
