name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: 3.237.33.146
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
              export PATH=$PATH:/usr/local/bin:/home/ec2-user/.nvm/versions/node/v20.18.0/bin
              echo "Starting Deployment..."
              pwd
              ls -la
              
              # Try to find the directory
              if [ -d "Assignflow" ]; then
                cd Assignflow
              elif [ -d "assignflow" ]; then
                cd assignflow
              elif [ -d "ssignflow" ]; then
                cd ssignflow
              else
                echo "❌ Project directory not found!"
                exit 1
              fi
              
              echo "Deploying in $(pwd)"
              
              # Force update .env with correct key
              echo "Updating .env..."
              # We overwrite .env to ensure it is clean and has the key
              # WARNING: This verifies DATABASE_URL is not lost? 
              # Better to APPEND or use careful sed.
              # But user said "do it automatically".
              # Let's assume DATABASE_URL is in ENVIRONMENT VARS of the system/PM2, not just .env file?
              # Or stored in .env?
              # If we overwrite .env, we lose DATABASE_URL if it was there!
              # I should be safe.
              
              if [ -f .env ]; then
                 # Remove existing key if present
                 sed -i '/GEMINI_API_KEY/d' .env
                 # Append new key
                 echo "GEMINI_API_KEY=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" >> .env
              else
                 echo "GEMINI_API_KEY=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" > .env
              fi
              
              git pull origin main
              npm install
              npm run build:static
              pm2 restart all || pm2 start dist/index.js --name "assignflow"
              echo "✅ Deployment Complete"
