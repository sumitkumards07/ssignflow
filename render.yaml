services:
  - type: web
    name: assignflow
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.12.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
